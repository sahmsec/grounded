services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: grounded-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: grounded
      POSTGRES_PASSWORD: grounded
      POSTGRES_DB: grounded
    ports:
      - "5433:5432"
    volumes:
      - grounded-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grounded -d grounded"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  grounded-pgdata:
