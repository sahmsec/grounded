<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>grounded — course assistant</title>
<style>
  /* Light is the base. Dark is applied when the OS prefers it and the user has
     not explicitly chosen light, or when they explicitly choose dark. Every
     colour is a token so no rule is defined inside a single theme's block. */
  :root {
    --bg:#FFFFFF;
    --glow: 118, 150, 255;
    --glow-strength: .18;
    --field:#F0F4F9;
    --field-hover:#E8EEF7;
    --raised:#F4F6FA;
    --ink:#1F1F22;
    --ink-2:#5C606A;
    --ink-3:#8C919B;
    --accent:#2B62D9;
    --accent-ink:#FFFFFF;
    --flag:#8A5A05;
    --flag-bg:#FBF1DF;
    --error:#B3261E;
    --sans: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", sans-serif;
    --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0E0E10;
      --glow: 46, 84, 196;
      --glow-strength: .40;
      --field:#1D1E21;
      --field-hover:#25262A;
      --raised:#191A1D;
      --ink:#E5E6E9;
      --ink-2:#A6AAB2;
      --ink-3:#787D86;
      --accent:#8CA6F8;
      --accent-ink:#0E0E10;
      --flag:#DFAC53;
      --flag-bg:#2A2110;
      --error:#F09A9A;
    }
  }
  :root[data-theme="dark"] {
    --bg:#0E0E10;
    --glow: 46, 84, 196;
    --glow-strength: .40;
    --field:#1D1E21;
    --field-hover:#25262A;
    --raised:#191A1D;
    --ink:#E5E6E9;
    --ink-2:#A6AAB2;
    --ink-3:#787D86;
    --accent:#8CA6F8;
    --accent-ink:#0E0E10;
    --flag:#DFAC53;
    --flag-bg:#2A2110;
    --error:#F09A9A;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-size: 16px; line-height: 1.72;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; overflow: hidden;
  }
  button { font: inherit; }

  /* The single decorative element: a wide wash centred behind the composer,
     which fades once a conversation starts so text sits on a plain ground. */
  .wash {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: radial-gradient(
      ellipse 62vw 46vh at 50% 46%,
      rgba(var(--glow), var(--glow-strength)) 0%,
      rgba(var(--glow), calc(var(--glow-strength) * .45)) 34%,
      transparent 72%);
    transition: opacity .7s ease;
  }
  body.chatting .wash { opacity: 0; }
  @media (prefers-reduced-motion: reduce) { .wash { transition: none; } }

  /* ─────────── top bar ─────────── */
  .bar {
    position: relative; z-index: 2; flex: none; height: 58px;
    display: flex; align-items: center; gap: 6px; padding: 0 18px;
  }
  .brand {
    display: flex; align-items: center; gap: 8px; margin-right: auto;
    color: var(--ink-2); font-size: 15px; font-weight: 500; letter-spacing: -.01em;
  }
  .brand svg { display: block; opacity: .75; }

  .chip {
    border: 0; background: transparent; color: var(--ink-2); cursor: pointer;
    border-radius: 999px; padding: 7px 14px; font-size: 13.5px;
    display: flex; align-items: center; gap: 7px; transition: background .15s, color .15s;
  }
  .chip:hover { background: var(--raised); color: var(--ink); }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .chip svg { display: block; }
  .chip .caret { transition: transform .2s; }
  .chip[aria-expanded="true"] .caret { transform: rotate(180deg); }
  .chip.icon-only { padding: 8px; }

  /* Only the icon matching the active theme is shown. */
  .icon-dark { display: none; }
  :root[data-theme="dark"] .icon-dark { display: block; }
  :root[data-theme="dark"] .icon-light { display: none; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .icon-dark { display: block; }
    :root:not([data-theme="light"]) .icon-light { display: none; }
  }

  .topics { position: relative; z-index: 2; flex: none; padding: 0 18px 4px; }
  .topics[hidden] { display: none; }
  .topics-inner {
    max-width: 820px; margin: 0 auto; background: var(--raised);
    border-radius: 20px; padding: 17px 20px;
    display: flex; flex-wrap: wrap; gap: 8px;
  }
  .topics-inner p { width: 100%; margin: 0 0 6px; font-size: 13px; color: var(--ink-3); }
  .topic {
    font-size: 13px; color: var(--ink-2); background: var(--bg);
    border-radius: 999px; padding: 4px 13px;
  }

  /* ─────────── stage / thread ─────────── */
  main {
    position: relative; z-index: 1; flex: 1; min-height: 0;
    display: flex; flex-direction: column; overflow-y: auto;
  }

  .stage {
    margin: auto; width: 100%; max-width: 820px; padding: 0 22px 6vh;
    display: flex; flex-direction: column; align-items: center;
  }
  .welcome { text-align: center; margin: 0 0 32px; }
  .welcome h1 {
    margin: 0; font-size: clamp(28px, 5.2vw, 45px); font-weight: 400;
    letter-spacing: -.024em; line-height: 1.14; color: var(--ink);
  }
  .welcome p {
    margin: 12px 0 0; font-size: clamp(15.5px, 2vw, 18px); font-weight: 400;
    color: var(--ink-3); line-height: 1.5;
  }

  .thread { max-width: 820px; width: 100%; margin: 0 auto; padding: 6px 22px 12px; }
  .thread:empty { display: none; }

  .turn { margin-bottom: 40px; }

  .asked { display: flex; justify-content: flex-end; margin-bottom: 28px; }
  .asked span {
    background: var(--field); border-radius: 22px; padding: 12px 20px;
    max-width: 84%; white-space: pre-wrap; overflow-wrap: anywhere;
  }

  .reply { display: flex; gap: 16px; align-items: flex-start; }
  .glyph { flex: none; width: 24px; margin-top: 6px; color: var(--accent); opacity: .85; }
  .glyph svg { display: block; }
  .body { flex: 1; min-width: 0; }

  .answer { white-space: pre-wrap; overflow-wrap: anywhere; }
  .refused .answer { color: var(--ink-2); }

  /* Only the exception is marked; an ordinary answer wears no decoration. */
  .flag {
    display: inline-block; font-size: 12.5px; font-weight: 600; color: var(--flag);
    background: var(--flag-bg); border-radius: 999px; padding: 3px 12px; margin-bottom: 12px;
  }
  .flag.is-error { color: var(--error); background: none; box-shadow: inset 0 0 0 1px currentColor; }

  .sources { margin-top: 22px; }
  .sources-head {
    font-size: 11.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase;
    color: var(--ink-3); margin-bottom: 9px;
  }
  .source {
    display: flex; gap: 11px; align-items: baseline; font-size: 14px; color: var(--ink-2);
    background: var(--raised); border-radius: 13px; padding: 9px 15px; margin-bottom: 6px;
  }
  .source:last-child { margin-bottom: 0; }
  .source .n { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); flex: none; }
  .source .name { color: var(--ink); }
  .source .cite { margin-left: auto; font-size: 12.5px; color: var(--ink-3); white-space: nowrap; }

  .meta { margin-top: 14px; font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

  .waiting { color: var(--ink-3); }
  .waiting::after { content: "▍"; margin-left: 2px; animation: blink 1.05s steps(2,start) infinite; }
  @keyframes blink { to { visibility: hidden } }
  @media (prefers-reduced-motion: reduce) { .waiting::after { animation: none } }

  /* ─────────── composer ─────────── */
  .composer { width: 100%; max-width: 820px; }

  .field {
    display: flex; align-items: flex-end; gap: 10px;
    background: var(--field); border-radius: 30px; padding: 9px 9px 9px 24px;
    transition: background .15s;
  }
  .field:focus-within { background: var(--field-hover); }
  textarea {
    flex: 1; border: 0; background: none; resize: none; font: inherit; color: var(--ink);
    padding: 14px 0; line-height: 1.5; min-height: 28px; max-height: 200px;
  }
  textarea:focus { outline: none; }
  textarea::placeholder { color: var(--ink-3); }

  .send {
    flex: none; width: 42px; height: 42px; border: 0; border-radius: 50%; cursor: pointer;
    background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; transition: opacity .15s, transform .1s;
  }
  .send:disabled { opacity: .28; cursor: default; }
  .send:not(:disabled):active { transform: scale(.93); }
  .send:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .send svg { display: block; }

  /* The welcome line states the scope while empty, so this only appears once
     the greeting is gone and the reminder is no longer on screen. */
  .disclaimer { margin: 11px 0 0; text-align: center; font-size: 12px; color: var(--ink-3); }
  body:not(.chatting) .disclaimer { display: none; }

  .dock {
    position: relative; z-index: 2; flex: none; padding: 4px 22px 16px;
    display: flex; flex-direction: column; align-items: center;
  }
  .dock:empty { display: none; }

  @media (max-width: 620px) {
    .bar { padding: 0 12px; }
    .stage, .thread, .dock, .topics { padding-left: 15px; padding-right: 15px; }
    .field { padding-left: 18px; }
    .source { flex-wrap: wrap; }
    .source .cite { margin-left: 0; }
  }
</style>
</head>
<body>

<div class="wash" aria-hidden="true"></div>

<div class="bar">
  <span class="brand">
    <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true">
      <path d="M10 2 3.2 5v4.8c0 4.3 2.9 8.3 6.8 9.4 3.9-1.1 6.8-5.1 6.8-9.4V5L10 2Z"
            stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
    </svg>
    grounded
  </span>

  <button class="chip" id="topics-btn" aria-expanded="false" aria-controls="topics" hidden>
    <span id="topics-count">Topics</span>
    <svg class="caret" width="11" height="11" viewBox="0 0 11 11" fill="none" aria-hidden="true">
      <path d="m2.4 4.1 3.1 3.1 3.1-3.1" stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <button class="chip icon-only" id="theme" aria-label="Switch between light and dark">
    <svg class="icon-light" width="17" height="17" viewBox="0 0 17 17" fill="none" aria-hidden="true">
      <path d="M14.2 9.6A5.8 5.8 0 0 1 7.4 2.8a5.8 5.8 0 1 0 6.8 6.8Z"
            stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
    </svg>
    <svg class="icon-dark" width="17" height="17" viewBox="0 0 17 17" fill="none" aria-hidden="true">
      <circle cx="8.5" cy="8.5" r="3.2" stroke="currentColor" stroke-width="1.4"/>
      <path d="M8.5 1.4v1.6M8.5 14v1.6M15.6 8.5H14M3 8.5H1.4M13.5 3.5l-1.1 1.1M4.6 12.4l-1.1 1.1M13.5 13.5l-1.1-1.1M4.6 4.6 3.5 3.5"
            stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
  </button>

  <button class="chip icon-only" id="reset" aria-label="Start a new conversation" hidden>
    <svg width="17" height="17" viewBox="0 0 17 17" fill="none" aria-hidden="true">
      <path d="M11.6 2.6a1.4 1.4 0 0 1 2 2L6.2 12l-2.7.7.7-2.7 7.4-7.4Z"
            stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
    </svg>
  </button>
</div>

<div class="topics" id="topics" hidden>
  <div class="topics-inner" id="topics-list">
    <p>Questions outside these topics are declined rather than guessed at.</p>
  </div>
</div>

<main>
  <div class="stage" id="stage">
    <div class="welcome">
      <h1 id="greeting">Hello</h1>
      <p id="subgreeting">Ask a question about any topic in the course.</p>
    </div>

    <div class="composer" id="composer">
      <div class="field">
        <textarea id="input" rows="1" aria-label="Your question"
                  placeholder="Ask about the course material"></textarea>
        <button class="send" id="send" aria-label="Send" disabled>
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
            <path d="M9 14.6V4M4.2 8.8 9 4l4.8 4.8" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      <p class="disclaimer">Answers come only from the course material, with sources shown.</p>
    </div>
  </div>

  <div class="thread" id="thread"></div>
</main>

<div class="dock" id="dock"></div>

<script>
(() => {
  const thread = document.getElementById('thread');
  const dock = document.getElementById('dock');
  const main = document.querySelector('main');
  const composer = document.getElementById('composer');
  const input = document.getElementById('input');
  const send = document.getElementById('send');
  const reset = document.getElementById('reset');

  // Reassigned on reset, so it cannot be a const bound to the first node.
  let stage = document.getElementById('stage');
  let chatting = false;

  /** Sent with each question so follow-ups like "explain more" resolve. */
  let history = [];

  /* ── theme ───────────────────────────────────────────────────────────── */
  const storedTheme = localStorage.getItem('grounded.theme');
  if (storedTheme === 'light' || storedTheme === 'dark') {
    document.documentElement.dataset.theme = storedTheme;
  }

  document.getElementById('theme').addEventListener('click', () => {
    const root = document.documentElement;
    const dark = root.dataset.theme
      ? root.dataset.theme === 'dark'
      : matchMedia('(prefers-color-scheme: dark)').matches;
    const next = dark ? 'light' : 'dark';
    root.dataset.theme = next;
    localStorage.setItem('grounded.theme', next);
  });

  /* ── who is asking ───────────────────────────────────────────────────── */
  /* Placeholder until real accounts exist. Set with ?name=Sakib once and it
     persists; swap this for the session user when auth lands. */
  const params = new URLSearchParams(location.search);
  const fromUrl = params.get('name');
  if (fromUrl !== null) {
    const cleaned = fromUrl.trim().slice(0, 40);
    if (cleaned) localStorage.setItem('grounded.name', cleaned);
    else localStorage.removeItem('grounded.name');
    params.delete('name');
    const query = params.toString();
    history.replaceState({}, '', location.pathname + (query ? '?' + query : ''));
  }
  const name = localStorage.getItem('grounded.name');

  function timeOfDay() {
    const hour = new Date().getHours();
    if (hour < 12) return 'Good morning';
    if (hour < 18) return 'Good afternoon';
    return 'Good evening';
  }

  const greetingText = name ? `${timeOfDay()}, ${name}` : 'Hello';
  document.getElementById('greeting').textContent = greetingText;

  /* ── rendering ───────────────────────────────────────────────────────── */
  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    // textContent throughout. Replies carry retrieved third-party text, so
    // rendering it as markup would be a genuine injection hole.
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function shield() {
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('width', '18'); svg.setAttribute('height', '18');
    svg.setAttribute('viewBox', '0 0 20 20'); svg.setAttribute('fill', 'none');
    const path = document.createElementNS(ns, 'path');
    path.setAttribute('d', 'M10 2 3.2 5v4.8c0 4.3 2.9 8.3 6.8 9.4 3.9-1.1 6.8-5.1 6.8-9.4V5L10 2Z');
    path.setAttribute('stroke', 'currentColor');
    path.setAttribute('stroke-width', '1.5');
    path.setAttribute('stroke-linejoin', 'round');
    svg.append(path);
    return svg;
  }

  function startChatting() {
    if (chatting) return;
    chatting = true;
    document.body.classList.add('chatting');
    dock.append(composer);
    stage?.remove();
    stage = null;
    reset.hidden = false;
  }

  function renderReply(result) {
    const row = el('div', 'reply' + (result.answered ? '' : ' refused'));
    const glyph = el('div', 'glyph');
    glyph.append(shield());
    row.append(glyph);

    const body = el('div', 'body');
    if (!result.answered) body.append(el('span', 'flag', 'Not in the course material'));
    body.append(el('div', 'answer', result.text));

    // Five passages from one document listed five times is noise. Group by
    // document and show which markers came from it.
    const grouped = new Map();
    for (const citation of result.citations) {
      const existing = grouped.get(citation.documentSlug);
      if (existing) existing.markers.push(citation.marker);
      else grouped.set(citation.documentSlug, { ...citation, markers: [citation.marker] });
    }

    if (grouped.size > 0) {
      const sources = el('div', 'sources');
      sources.append(el('div', 'sources-head', grouped.size === 1 ? 'Source' : 'Sources'));
      for (const citation of grouped.values()) {
        const item = el('div', 'source');
        item.append(el('span', 'n', citation.markers.join(', ')));
        item.append(el('span', 'name', citation.documentTitle));
        item.append(el('span', 'cite', citation.source));
        sources.append(item);
      }
      body.append(sources);
    }

    const score = result.topSimilarity === null ? '—' : result.topSimilarity.toFixed(2);
    body.append(el('div', 'meta', `Match ${score} · ${result.meta.latencyMs} ms`));

    row.append(body);
    return row;
  }

  function renderFailure(message) {
    const row = el('div', 'reply');
    const glyph = el('div', 'glyph');
    glyph.append(shield());
    row.append(glyph);

    const body = el('div', 'body');
    body.append(el('span', 'flag is-error', 'Request failed'));
    body.append(el('div', 'answer', message));
    row.append(body);
    return row;
  }

  async function ask() {
    const question = input.value.trim();
    if (!question) return;

    startChatting();
    input.value = '';
    resize();

    const turn = el('div', 'turn');
    const asked = el('div', 'asked');
    asked.append(el('span', null, question));
    turn.append(asked);

    const waiting = el('div', 'reply');
    const waitGlyph = el('div', 'glyph');
    waitGlyph.append(shield());
    waiting.append(waitGlyph);
    waiting.append(el('div', 'waiting', 'Searching the course material'));
    turn.append(waiting);

    thread.append(turn);
    turn.scrollIntoView({ block: 'end', behavior: 'smooth' });

    try {
      const response = await fetch('/ask', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ question, history }),
      });
      const payload = await response.json();

      if (response.ok) {
        history.push({ role: 'user', content: question });
        history.push({ role: 'assistant', content: payload.text });
        // Only recent turns matter for resolving a reference, and the server
        // trims too — this just avoids sending a whole transcript every time.
        history = history.slice(-8);
      }
      waiting.replaceWith(response.ok
        ? renderReply(payload)
        : renderFailure(payload.message ?? 'The request could not be completed.'));
    } catch {
      waiting.replaceWith(renderFailure('Could not reach the server. Check that it is still running.'));
    } finally {
      // resize() rather than a bare enable: the button's state depends on
      // whether anything was typed while the reply was in flight.
      resize();
      input.focus();
      turn.scrollIntoView({ block: 'end', behavior: 'smooth' });
    }
  }

  function resize() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 200) + 'px';
    send.disabled = input.value.trim().length === 0;
  }

  input.addEventListener('input', resize);
  input.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); ask(); }
  });
  send.addEventListener('click', ask);

  reset.addEventListener('click', () => {
    thread.replaceChildren();
    history = [];
    chatting = false;
    document.body.classList.remove('chatting');
    reset.hidden = true;

    stage = el('div', 'stage');
    const welcome = el('div', 'welcome');
    welcome.append(el('h1', null, greetingText));
    welcome.append(el('p', null, 'Ask a question about any topic in the course.'));
    stage.append(welcome, composer);
    main.prepend(stage);
    input.focus();
  });

  const toggle = document.getElementById('topics-btn');
  const panel = document.getElementById('topics');
  toggle.addEventListener('click', () => {
    const open = toggle.getAttribute('aria-expanded') === 'true';
    toggle.setAttribute('aria-expanded', String(!open));
    panel.hidden = open;
  });

  (async () => {
    try {
      const { modules } = await (await fetch('/modules')).json();
      if (modules.length === 0) return;

      document.getElementById('topics-count').textContent = `${modules.length} topics`;
      toggle.hidden = false;

      const list = document.getElementById('topics-list');
      for (const module of modules) list.append(el('span', 'topic', module.title));
    } catch { /* Header control stays hidden; asking still works. */ }
  })();

  input.focus();
})();
</script>
</body>
</html>
