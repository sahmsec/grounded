<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>grounded — course assistant</title>
<style>
  :root {
    --bg:#FFFFFF;
    --surface:#F0F4F9;
    --surface-2:#E9EEF6;
    --ink:#1F1F22;
    --ink-2:#5B5F66;
    --ink-3:#8E9299;
    --hairline:#E3E6EB;
    --accent:#2B62D9;
    --accent-2:#6B4FD8;
    --accent-ink:#FFFFFF;
    --flag:#8A5A05;
    --flag-bg:#FDF3E2;
    --error:#B3261E;
    --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", sans-serif;
    --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#131316;
      --surface:#1E1F24;
      --surface-2:#282A30;
      --ink:#E8E8EC;
      --ink-2:#A8ACB4;
      --ink-3:#787D85;
      --hairline:#2A2C32;
      --accent:#8AA6F5;
      --accent-2:#B49CF7;
      --accent-ink:#101014;
      --flag:#DFAC53;
      --flag-bg:#2A2110;
      --error:#F2A0A0;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-size: 16px; line-height: 1.72;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
  }
  button { font: inherit; }

  /* ─────────── top bar ─────────── */
  .bar { flex: none; height: 62px; display: flex; align-items: center; padding: 0 22px; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 9px; margin-right: auto; }
  .brand svg { display: block; color: var(--accent); }
  .brand b { font-size: 17px; font-weight: 600; letter-spacing: -.012em; color: var(--ink-2); }

  .topics-btn {
    border: 0; background: var(--surface); color: var(--ink-2); cursor: pointer;
    border-radius: 999px; padding: 7px 15px; font-size: 13.5px;
    display: flex; align-items: center; gap: 8px; transition: background .14s;
  }
  .topics-btn:hover { background: var(--surface-2); }
  .topics-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .topics-btn svg { transition: transform .18s; }
  .topics-btn[aria-expanded="true"] svg { transform: rotate(180deg); }

  .topics { flex: none; padding: 0 22px 6px; }
  .topics[hidden] { display: none; }
  .topics-inner {
    max-width: 780px; margin: 0 auto; background: var(--surface);
    border-radius: 18px; padding: 18px 22px;
    display: flex; flex-wrap: wrap; gap: 8px;
  }
  .topics-inner p { width: 100%; margin: 0 0 6px; font-size: 13px; color: var(--ink-3); }
  .topic {
    font-size: 13px; color: var(--ink-2); background: var(--bg);
    border-radius: 999px; padding: 4px 13px;
  }

  /* ─────────── thread ─────────── */
  main { flex: 1; overflow-y: auto; }
  .thread { max-width: 780px; margin: 0 auto; padding: 20px 22px 8px; }

  .greeting { padding: 12vh 0 0; }
  .greeting h1 {
    margin: 0 0 6px; font-size: clamp(32px, 6vw, 46px); font-weight: 600;
    letter-spacing: -.032em; line-height: 1.1;
    background: linear-gradient(96deg, var(--accent) 8%, var(--accent-2) 78%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    width: fit-content;
  }
  .greeting p {
    margin: 0; font-size: clamp(21px, 3.6vw, 29px); font-weight: 500;
    letter-spacing: -.022em; color: var(--ink-3); line-height: 1.25;
  }

  .turn { margin-bottom: 42px; }

  .asked { display: flex; justify-content: flex-end; margin-bottom: 30px; }
  .asked span {
    background: var(--surface); border-radius: 22px; padding: 12px 19px;
    max-width: 84%; white-space: pre-wrap; overflow-wrap: anywhere;
  }

  .reply { display: flex; gap: 16px; align-items: flex-start; }
  .glyph {
    flex: none; width: 26px; height: 26px; margin-top: 4px;
    display: grid; place-items: center; color: var(--accent);
  }
  .glyph svg { display: block; }
  .body { flex: 1; min-width: 0; }

  .answer { white-space: pre-wrap; overflow-wrap: anywhere; }
  .refused .answer { color: var(--ink-2); }

  /* Only the exception is marked; a normal answer wears no decoration. */
  .flag {
    display: inline-block; font-size: 12.5px; font-weight: 600; color: var(--flag);
    background: var(--flag-bg); border-radius: 999px; padding: 3px 12px; margin-bottom: 12px;
  }
  .flag.is-error { color: var(--error); background: none; box-shadow: inset 0 0 0 1px currentColor; }

  .sources { margin-top: 22px; }
  .sources-head {
    font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: var(--ink-3); margin-bottom: 9px;
  }
  .source {
    display: flex; gap: 11px; align-items: baseline; font-size: 14px; color: var(--ink-2);
    background: var(--surface); border-radius: 12px; padding: 9px 14px; margin-bottom: 6px;
  }
  .source:last-child { margin-bottom: 0; }
  .source .n { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); flex: none; }
  .source .name { color: var(--ink); }
  .source .cite { margin-left: auto; font-size: 12.5px; color: var(--ink-3); white-space: nowrap; }

  .meta { margin-top: 14px; font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

  .waiting { color: var(--ink-3); }
  .waiting::after {
    content: "▍"; margin-left: 2px; animation: blink 1.05s steps(2, start) infinite;
  }
  @keyframes blink { to { visibility: hidden } }
  @media (prefers-reduced-motion: reduce) { .waiting::after { animation: none } }

  /* ─────────── composer ─────────── */
  .dock { flex: none; padding: 10px 22px 18px; background: var(--bg); }
  .dock-inner { max-width: 780px; margin: 0 auto; }

  .field {
    display: flex; align-items: flex-end; gap: 10px;
    background: var(--surface); border-radius: 28px; padding: 8px 8px 8px 22px;
    transition: background .14s, box-shadow .14s;
  }
  .field:focus-within { background: var(--surface-2); box-shadow: 0 1px 10px rgba(0,0,0,.06); }
  textarea {
    flex: 1; border: 0; background: none; resize: none; font: inherit; color: var(--ink);
    padding: 12px 0; line-height: 1.5; min-height: 26px; max-height: 190px;
  }
  textarea:focus { outline: none; }
  textarea::placeholder { color: var(--ink-3); }

  .send {
    flex: none; width: 40px; height: 40px; border: 0; border-radius: 50%; cursor: pointer;
    background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; transition: opacity .14s;
  }
  .send:disabled { opacity: .3; cursor: default; }
  .send:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .send svg { display: block; }

  .disclaimer { margin-top: 11px; text-align: center; font-size: 12px; color: var(--ink-3); }

  @media (max-width: 620px) {
    .thread, .dock, .bar, .topics { padding-left: 15px; padding-right: 15px; }
    .greeting { padding-top: 8vh; }
    .source { flex-wrap: wrap; }
    .source .cite { margin-left: 0; }
  }
</style>
</head>
<body>

<div class="bar">
  <span class="brand">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
      <path d="M10 2 3.2 5v4.8c0 4.3 2.9 8.3 6.8 9.4 3.9-1.1 6.8-5.1 6.8-9.4V5L10 2Z"
            stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
    </svg>
    <b>grounded</b>
  </span>
  <button class="topics-btn" id="topics-btn" aria-expanded="false" aria-controls="topics" hidden>
    <span id="topics-count">Topics</span>
    <svg width="11" height="11" viewBox="0 0 11 11" fill="none" aria-hidden="true">
      <path d="m2.4 4.1 3.1 3.1 3.1-3.1" stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</div>

<div class="topics" id="topics" hidden>
  <div class="topics-inner" id="topics-list">
    <p>Questions outside these topics are declined rather than guessed at.</p>
  </div>
</div>

<main>
  <div class="thread" id="thread">
    <div class="greeting" id="greeting">
      <h1>Hello</h1>
      <p>What would you like to know?</p>
    </div>
  </div>
</main>

<div class="dock">
  <div class="dock-inner">
    <div class="field">
      <textarea id="input" rows="1" aria-label="Your question" placeholder="Ask about the course material"></textarea>
      <button class="send" id="send" aria-label="Send">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
          <path d="M9 14.5V4M4.2 8.8 9 4l4.8 4.8" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <div class="disclaimer">Answers come only from the course material, with sources shown.</div>
  </div>
</div>

<script>
(() => {
  const thread = document.getElementById('thread');
  const input = document.getElementById('input');
  const send = document.getElementById('send');

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    // textContent throughout. Replies carry retrieved third-party text, so
    // rendering it as markup would be a genuine injection hole.
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function shield() {
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('width', '19'); svg.setAttribute('height', '19');
    svg.setAttribute('viewBox', '0 0 20 20'); svg.setAttribute('fill', 'none');
    const path = document.createElementNS(ns, 'path');
    path.setAttribute('d', 'M10 2 3.2 5v4.8c0 4.3 2.9 8.3 6.8 9.4 3.9-1.1 6.8-5.1 6.8-9.4V5L10 2Z');
    path.setAttribute('stroke', 'currentColor');
    path.setAttribute('stroke-width', '1.5');
    path.setAttribute('stroke-linejoin', 'round');
    svg.append(path);
    return svg;
  }

  function renderReply(result) {
    const row = el('div', 'reply' + (result.answered ? '' : ' refused'));
    const glyph = el('div', 'glyph');
    glyph.append(shield());
    row.append(glyph);

    const body = el('div', 'body');
    if (!result.answered) body.append(el('span', 'flag', 'Not in the course material'));
    body.append(el('div', 'answer', result.text));

    if (result.citations.length > 0) {
      const sources = el('div', 'sources');
      sources.append(el('div', 'sources-head', 'Sources'));
      for (const citation of result.citations) {
        const item = el('div', 'source');
        item.append(el('span', 'n', String(citation.marker)));
        item.append(el('span', 'name', citation.documentTitle));
        item.append(el('span', 'cite', citation.source));
        sources.append(item);
      }
      body.append(sources);
    }

    const score = result.topSimilarity === null ? '—' : result.topSimilarity.toFixed(2);
    body.append(el('div', 'meta', `Match ${score} · ${result.meta.latencyMs} ms`));

    row.append(body);
    return row;
  }

  function renderFailure(message) {
    const row = el('div', 'reply');
    const glyph = el('div', 'glyph');
    glyph.append(shield());
    row.append(glyph);

    const body = el('div', 'body');
    body.append(el('span', 'flag is-error', 'Request failed'));
    body.append(el('div', 'answer', message));
    row.append(body);
    return row;
  }

  async function ask() {
    const question = input.value.trim();
    if (!question) return;

    document.getElementById('greeting')?.remove();
    input.value = '';
    resize();
    send.disabled = true;

    const turn = el('div', 'turn');
    const asked = el('div', 'asked');
    asked.append(el('span', null, question));
    turn.append(asked);

    const waiting = el('div', 'reply');
    const waitGlyph = el('div', 'glyph');
    waitGlyph.append(shield());
    waiting.append(waitGlyph);
    waiting.append(el('div', 'waiting', 'Searching the course material'));
    turn.append(waiting);

    thread.append(turn);
    turn.scrollIntoView({ block: 'end', behavior: 'smooth' });

    try {
      const response = await fetch('/ask', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ question }),
      });
      const payload = await response.json();
      waiting.replaceWith(response.ok
        ? renderReply(payload)
        : renderFailure(payload.message ?? 'The request could not be completed.'));
    } catch {
      waiting.replaceWith(renderFailure('Could not reach the server. Check that it is still running.'));
    } finally {
      send.disabled = false;
      input.focus();
      turn.scrollIntoView({ block: 'end', behavior: 'smooth' });
    }
  }

  function resize() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 190) + 'px';
  }

  input.addEventListener('input', resize);
  input.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); ask(); }
  });
  send.addEventListener('click', ask);

  const toggle = document.getElementById('topics-btn');
  const panel = document.getElementById('topics');
  toggle.addEventListener('click', () => {
    const open = toggle.getAttribute('aria-expanded') === 'true';
    toggle.setAttribute('aria-expanded', String(!open));
    panel.hidden = open;
  });

  (async () => {
    try {
      const { modules } = await (await fetch('/modules')).json();
      if (modules.length === 0) return;

      document.getElementById('topics-count').textContent = `${modules.length} topics`;
      toggle.hidden = false;

      const list = document.getElementById('topics-list');
      for (const module of modules) list.append(el('span', 'topic', module.title));
    } catch { /* Header control stays hidden; asking still works. */ }
  })();

  input.focus();
})();
</script>
</body>
</html>
